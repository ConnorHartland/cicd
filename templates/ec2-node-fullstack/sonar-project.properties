# SonarQube Configuration for Fullstack Monorepo
# Scans both server (root) and client code

# Project identification (REQUIRED - update for your project)
sonar.projectKey=your-project-key
sonar.projectName=Your Fullstack App

# Source directories - scan both server and client
sonar.sources=src,client/src

# Test directories
sonar.tests=src/__tests__,client/src/__tests__

# Exclusions - common patterns to exclude
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/client/build/**,\
  **/client/dist/**

# Test file patterns
sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Coverage report locations (if using Jest)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,client/coverage/lcov.info

# TypeScript support
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8

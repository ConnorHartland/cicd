definitions:
  steps:
    - step: &build
        name: Build & Test
        script:
          - npm ci --silent
          - npm run lint
          - npm run test
          - npm run build
          - |
            # Run SonarQube analysis (CE - no branch/PR support)
            if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
              sonar-scanner \
                -Dsonar.host.url=$SONAR_HOST_URL \
                -Dsonar.token=$SONAR_TOKEN
            fi
          - |
            # Run PR report only in PR context
            if [ -n "$BITBUCKET_PR_ID" ]; then
              ./scripts/pr_report.sh
            fi
          - zip -rq build_${BITBUCKET_COMMIT}.zip dist node_modules package.json package-lock.json
        artifacts:
          - build*.zip
        runs-on:
          - self.hosted
          - linux.shell
          - node22

    - step: &build-release
        name: Build & Test (Release)
        script:
          - npm ci --silent
          - npm run lint
          - npm run test
          - npm run build
          - |
            # Run SonarQube analysis (branch analysis for releases)
            if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
              VERSION=${BITBUCKET_BRANCH#release/}
              sonar-scanner \
                -Dsonar.host.url=$SONAR_HOST_URL \
                -Dsonar.token=$SONAR_TOKEN \
                -Dsonar.projectVersion=$VERSION
            fi
          - ./scripts/release_report.sh
          - zip -rq build_${BITBUCKET_COMMIT}.zip dist node_modules package.json package-lock.json
        artifacts:
          - build*.zip
          - release-report.json
          - release-report.html
        runs-on:
          - self.hosted
          - linux.shell
          - node22

    - step: &predeploy-nonprod
        name: Pre-deploy
        script:
          - ./scripts/setup_kafka.sh $ENV_SUFFIX $ALLOW_TOPIC_RECREATE
          - ./scripts/prisma_migration.sh $SERVICE_NAME $ENV_SUFFIX $SEED
        runs-on:
          - self.hosted
          - linux.shell
          - node22

    - step: &predeploy-prod
        name: Pre-deploy (Production)
        script:
          - ./scripts/setup_kafka.sh $ENV_SUFFIX
          - ./scripts/prisma_migration.sh $SERVICE_NAME $ENV_SUFFIX
        runs-on:
          - self.hosted
          - linux.shell
          - node22.prod

    - step: &deploy
        name: Deploy to AWS
        image: amazon/aws-cli
        script:
          - |
            export AWS_ACCESS_KEY_ID=$(eval echo \$AWS_ACCESS_KEY_ID_$AWS_SUFFIX)
            export AWS_SECRET_ACCESS_KEY=$(eval echo \$AWS_SECRET_ACCESS_KEY_$AWS_SUFFIX)
          - aws s3 rm s3://$S3_BUCKET --recursive --exclude "*.env" --quiet
          - aws s3 cp build_${BITBUCKET_COMMIT}.zip s3://$S3_BUCKET/build.zip --quiet
          - |
            PREFERENCES="{\"InstanceWarmup\": ${INSTANCE_WARMUP:-300}}"
            aws autoscaling start-instance-refresh --region us-east-1 \
              --auto-scaling-group-name $ASG_NAME \
              --preferences "$PREFERENCES"

    - step: &verify-deploy
        name: Verify Deployment
        image: amazon/aws-cli
        script:
          - |
            export AWS_ACCESS_KEY_ID=$(eval echo \$AWS_ACCESS_KEY_ID_$AWS_SUFFIX)
            export AWS_SECRET_ACCESS_KEY=$(eval echo \$AWS_SECRET_ACCESS_KEY_$AWS_SUFFIX)
          - ./scripts/verify_deploy.sh
          - ./scripts/newrelic_deploy.sh

    - step: &tag-release
        name: Tag Release
        script:
          - |
            # Extract version from the merge commit message (expects "release/X.X.X" in message)
            VERSION=$(git log -1 --pretty=%B | grep -oE 'release/[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/release\///' || echo "")
            if [ -z "$VERSION" ]; then
              # Fallback: try to find version pattern directly
              VERSION=$(git log -1 --pretty=%B | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
            fi
            if [ -n "$VERSION" ]; then
              echo "Tagging release v${VERSION}"
              git tag -a "v${VERSION}" -m "Release ${VERSION}"
              git push origin "v${VERSION}"
            else
              echo "No version found in commit message, skipping tag"
            fi

pipelines:
  # ===================
  # PULL REQUESTS
  # ===================
  pull-requests:
    # All PRs get basic CI (including hotfix/*)
    "**":
      - step: *build

    # PRs from release/* branches get full release pipeline
    "release/*":
      - step: *build-release
      - stage:
          name: Deploy to Test
          deployment: Test
          steps:
            - step: *predeploy-nonprod
            - step: *deploy
            - step: *verify-deploy
      - stage:
          name: Deploy to Staging
          deployment: Staging
          trigger: manual
          steps:
            - step: *predeploy-nonprod
            - step: *deploy
            - step: *verify-deploy
      - stage:
          name: Deploy to Production
          deployment: Production
          trigger: manual
          steps:
            - step: *predeploy-prod
            - step: *deploy
            - step: *verify-deploy

  # ===================
  # BRANCH PUSHES
  # ===================
  branches:
    # Feature branches - CI only (use deploy-to-develop custom pipeline to deploy)
    feature/*:
      - step: *build

    # Main branch - tag release after PR merge
    main:
      - step: *tag-release

  # ===================
  # CUSTOM PIPELINES
  # ===================
  custom:
    deploy-to-develop:
      - variables:
          - name: SEED
            default: "false"
            allowed-values:
              - "true"
              - "false"
      - step: *build
      - stage:
          name: Deploy to Develop
          deployment: Develop
          steps:
            - step: *predeploy-nonprod
            - step: *deploy
            - step: *verify-deploy

    deploy-to-test:
      - variables:
          - name: SEED
            default: "false"
            allowed-values:
              - "true"
              - "false"
      - step: *build
      - stage:
          name: Deploy to Test
          deployment: Test
          steps:
            - step: *predeploy-nonprod
            - step: *deploy
            - step: *verify-deploy

    deploy-hotfix:
      - step: *build-release
      - stage:
          name: Deploy to Production
          deployment: Production
          steps:
            - step: *predeploy-prod
            - step: *deploy
            - step: *verify-deploy

    setup-kafka:
      - variables:
          - name: ENV_SUFFIX
            default: "dev"
            allowed-values:
              - "dev"
              - "test"
              - "qa"
          - name: ALLOW_TOPIC_RECREATE
            default: "false"
            allowed-values:
              - "true"
              - "false"
      - step:
          name: Setup Kafka
          script:
            - npm ci
            - ./scripts/setup_kafka.sh $ENV_SUFFIX $ALLOW_TOPIC_RECREATE
          runs-on:
            - self.hosted
            - linux.shell
            - node22

    docker-build:
      - step:
          name: Build & Push Docker Image
          image: docker:24-dind
          services:
            - docker
          script:
            - |
              # Generate tags
              SHORT_SHA=${BITBUCKET_COMMIT:0:7}
              BRANCH_TAG=$(echo "$BITBUCKET_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')

              echo "Building Docker image..."
              echo "  Repository: ${DOCKER_REPO}"
              echo "  Tags: ${SHORT_SHA}, ${BRANCH_TAG}"
            - |
              # Build the image
              docker build -t ${DOCKER_REPO}:${BITBUCKET_COMMIT:0:7} \
                           -t ${DOCKER_REPO}:$(echo "$BITBUCKET_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]') \
                           .
            - |
              # Login to Docker Hub
              echo "${DOCKER_TOKEN}" | docker login -u "${DOCKER_USERNAME}" --password-stdin
            - |
              # Push tags
              docker push ${DOCKER_REPO}:${BITBUCKET_COMMIT:0:7}
              docker push ${DOCKER_REPO}:$(echo "$BITBUCKET_BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
            - echo "Docker image pushed successfully"

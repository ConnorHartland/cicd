image: node:20

definitions:
  services:
    docker:
      memory: 2048

  steps:
    # -------------------------------------------------------------------------
    # Unit Tests & Linting
    # -------------------------------------------------------------------------
    - step: &test
        name: Test
        caches:
          - node
        script:
          - npm ci
          - npm run lint
          - npm run test

    # -------------------------------------------------------------------------
    # Security: Dependency Scanning (Snyk)
    # -------------------------------------------------------------------------
    - step: &security-deps
        name: Snyk Dependency Scan
        caches:
          - node
        script:
          - npm ci
          - pipe: snyk/snyk-scan:1.0.0
            variables:
              SNYK_TOKEN: $SNYK_TOKEN
              LANGUAGE: "npm"
              SEVERITY_THRESHOLD: "high"
              DONT_BREAK_BUILD: "false"
              MONITOR: "true"
        artifacts:
          - snyk-report.json

    # -------------------------------------------------------------------------
    # Security: Code Quality & SAST (SonarCloud)
    # -------------------------------------------------------------------------
    - step: &security-sast
        name: SonarCloud Analysis
        caches:
          - node
        script:
          - npm ci
          - npm run test:coverage || true
          - pipe: sonarsource/sonarcloud-scan:2.0.0
            variables:
              SONAR_TOKEN: $SONAR_TOKEN
              EXTRA_ARGS: >
                -Dsonar.projectKey=${SONAR_PROJECT_KEY}
                -Dsonar.organization=${SONAR_ORG}
                -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
          - pipe: sonarsource/sonarcloud-quality-gate:0.1.6
            variables:
              SONAR_TOKEN: $SONAR_TOKEN

    # -------------------------------------------------------------------------
    # Security: Secret Detection (Gitleaks)
    # -------------------------------------------------------------------------
    - step: &security-secrets
        name: Secret Detection
        image: zricethezav/gitleaks:latest
        script:
          - gitleaks detect --source . --verbose --redact --exit-code 1

    # -------------------------------------------------------------------------
    # Build and Push to ECR
    # -------------------------------------------------------------------------
    - step: &build-and-push
        name: Build and Push to ECR
        image: atlassian/pipelines-awscli:latest
        services:
          - docker
        script:
          - |
            echo "=== Building Docker image ==="
            SHORT_SHA="${BITBUCKET_COMMIT:0:7}"

            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Build image
            docker build \
              --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
              --build-arg GIT_COMMIT=$BITBUCKET_COMMIT \
              --build-arg GIT_BRANCH=$BITBUCKET_BRANCH \
              -t $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA \
              .

            # Tag based on branch
            if [[ "$BITBUCKET_BRANCH" == "develop" ]]; then
              docker tag $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA $ECR_REGISTRY/$ECR_REPO:dev
              docker push $ECR_REGISTRY/$ECR_REPO:dev
            elif [[ "$BITBUCKET_BRANCH" == release/* ]]; then
              VERSION=$(echo $BITBUCKET_BRANCH | sed 's/release\///')
              docker tag $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA $ECR_REGISTRY/$ECR_REPO:rc-$VERSION
              docker push $ECR_REGISTRY/$ECR_REPO:rc-$VERSION
            elif [[ "$BITBUCKET_BRANCH" == hotfix/* ]]; then
              docker tag $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA $ECR_REGISTRY/$ECR_REPO:hotfix-$SHORT_SHA
              docker push $ECR_REGISTRY/$ECR_REPO:hotfix-$SHORT_SHA
            elif [[ "$BITBUCKET_BRANCH" == "main" ]]; then
              docker tag $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA $ECR_REGISTRY/$ECR_REPO:latest
              docker push $ECR_REGISTRY/$ECR_REPO:latest
            fi

            # Always push commit SHA tag
            docker push $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA

            echo "=== Done ==="
            echo "Image: $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA"

    # -------------------------------------------------------------------------
    # Security: Container Image Scanning (Snyk Container)
    # -------------------------------------------------------------------------
    - step: &security-container
        name: Container Security Scan
        image: atlassian/pipelines-awscli:latest
        services:
          - docker
        script:
          - |
            SHORT_SHA="${BITBUCKET_COMMIT:0:7}"

            # Login to ECR
            aws ecr get-login-password --region $AWS_REGION \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Pull the image we just pushed
            docker pull $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA

            # Install Snyk CLI
            npm install -g snyk

            # Scan container image
            snyk auth $SNYK_TOKEN
            snyk container test $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA \
              --severity-threshold=high \
              --file=Dockerfile \
              --json-file-output=snyk-container-report.json || true

            # Monitor in Snyk (for ongoing alerts)
            snyk container monitor $ECR_REGISTRY/$ECR_REPO:$SHORT_SHA \
              --file=Dockerfile || true

            echo "=== Container scan complete ==="
        artifacts:
          - snyk-container-report.json

pipelines:
  # =============================================================================
  # PULL REQUESTS - Full security scan, no deploy
  # =============================================================================
  pull-requests:
    '**':
      - parallel:
          - step: *test
          - step: *security-deps
          - step: *security-secrets
      - step: *security-sast

  # =============================================================================
  # BRANCH PIPELINES (GitFlow)
  # =============================================================================
  branches:
    # ---------------------------------------------------------------------------
    # feature/* - Test + Security (no build, no deploy)
    # ---------------------------------------------------------------------------
    'feature/*':
      - parallel:
          - step: *test
          - step: *security-deps
          - step: *security-secrets
      - step: *security-sast

    # ---------------------------------------------------------------------------
    # develop - Full pipeline + Deploy to DEV (auto)
    # Triggers: Lambda DEV deployment via ECR push (:dev tag)
    # ---------------------------------------------------------------------------
    develop:
      - parallel:
          - step: *test
          - step: *security-deps
          - step: *security-secrets
      - step: *security-sast
      - step: *build-and-push
      - step: *security-container

    # ---------------------------------------------------------------------------
    # release/* - Full pipeline + Deploy through TEST → STAGING → PROD
    # Triggers: CodePipeline release deployment via ECR push (:rc-* tag)
    # ---------------------------------------------------------------------------
    'release/*':
      - parallel:
          - step: *test
          - step: *security-deps
          - step: *security-secrets
      - step: *security-sast
      - step: *build-and-push
      - step: *security-container

    # ---------------------------------------------------------------------------
    # hotfix/* - Full pipeline + Fast-track to PROD
    # Triggers: CodePipeline hotfix deployment via ECR push (:hotfix-* tag)
    # ---------------------------------------------------------------------------
    'hotfix/*':
      - parallel:
          - step: *test
          - step: *security-deps
          - step: *security-secrets
      - step: *security-sast
      - step: *build-and-push
      - step: *security-container

    # ---------------------------------------------------------------------------
    # main - Tag release after merge (no deploy, just tag)
    # This runs after release/hotfix is merged
    # ---------------------------------------------------------------------------
    main:
      - step:
          name: Tag Release
          script:
            - |
              # Get version from most recent tag or commit message
              VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -z "$VERSION" ]; then
                echo "No version tag found, skipping"
                exit 0
              fi

              echo "Release $VERSION merged to main"

              # Optionally re-tag image as :latest and :v{version}
              # This is handled by the release branch push

  # =============================================================================
  # CUSTOM PIPELINES (Manual triggers)
  # =============================================================================
  custom:
    # ---------------------------------------------------------------------------
    # Manual deploy to specific environment (for debugging/rollback)
    # ---------------------------------------------------------------------------
    deploy-image:
      - variables:
          - name: IMAGE_TAG
            description: "Docker image tag to deploy (e.g., abc123f, rc-1.2.0)"
          - name: ENVIRONMENT
            default: 'dev'
            allowed-values:
              - 'dev'
              - 'test'
              - 'staging'
              - 'prod'
      - step:
          name: Trigger Deployment
          image: atlassian/pipelines-awscli:latest
          script:
            - |
              echo "Triggering deployment of $IMAGE_TAG to $ENVIRONMENT"

              # Verify image exists
              aws ecr describe-images \
                --repository-name $ECR_REPO \
                --image-ids imageTag=$IMAGE_TAG \
                --region $AWS_REGION

              # Trigger CodePipeline (or use aws ecs update-service directly)
              aws codepipeline start-pipeline-execution \
                --name ${APP_NAME}-pipeline \
                --region $AWS_REGION

    # ---------------------------------------------------------------------------
    # Create release branch from develop
    # ---------------------------------------------------------------------------
    create-release:
      - variables:
          - name: VERSION
            description: "Release version (e.g., 1.2.0)"
      - step:
          name: Create Release Branch
          script:
            - |
              git fetch origin develop
              git checkout -b release/$VERSION origin/develop
              git push origin release/$VERSION
              echo "Created release/$VERSION branch"

    # ---------------------------------------------------------------------------
    # Manual security scan (on-demand)
    # ---------------------------------------------------------------------------
    security-scan:
      - parallel:
          - step: *security-deps
          - step: *security-secrets
      - step: *security-sast

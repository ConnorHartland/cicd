version: 0.0
os: linux

files:
  - source: /dist
    destination: /var/www/app/dist
  - source: /package.json
    destination: /var/www/app
  - source: /package-lock.json
    destination: /var/www/app

hooks:
  BeforeInstall:
    - location: scripts/deploy/before-install.sh
      timeout: 60
      runas: root

  AfterInstall:
    - location: scripts/deploy/after-install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/deploy/start.sh
      timeout: 60
      runas: root

  ValidateService:
    - location: scripts/deploy/validate.sh
      timeout: 60
      runas: root
